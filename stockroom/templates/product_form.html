{% extends "base.html" %}
{% block title %}{{ 'Edit product' if editing else 'Add product' }}{% endblock %}
{% block content %}
<header class="page-head">
  <h1>{{ 'Edit product' if editing else 'Add product' }}</h1>
</header>

{% if errors %}
<div class="flash flash-error" role="alert">
  <ul>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>
</div>
{% endif %}

<form method="post" class="panel form-grid">
  <label>SKU
    <input name="sku" value="{{ product.sku or '' }}" required autofocus>
  </label>
  <label>Product name
    <input name="name" value="{{ product.name or '' }}" required>
  </label>
  <label>Category
    <input name="category" value="{{ product.category or '' }}" placeholder="General">
  </label>
  <label>Supplier
    <input name="supplier" value="{{ product.supplier or '' }}">
  </label>
  <label>Quantity on hand
    <input name="quantity" type="number" min="0" step="1" value="{{ product.quantity if product.quantity is not none else 0 }}">
  </label>
  <label>Reorder level
    <input name="reorder_level" type="number" min="0" step="1" value="{{ product.reorder_level if product.reorder_level is not none else 10 }}">
    <small>You'll see a reorder warning at or below this number.</small>
  </label>
  <label>Unit price
    <input name="unit_price" type="number" min="0" step="0.01" value="{{ product.unit_price if product.unit_price is not none else 0 }}">
  </label>
  <div class="form-actions">
    <button class="btn" type="submit">{{ 'Save changes' if editing else 'Add product' }}</button>
    <a class="btn btn-quiet" href="{{ url_for('product_detail', product_id=product_id) if editing else url_for('products') }}">Cancel</a>
  </div>
</form>
{% endblock %}
